# shellcheck disable=SC2034 # Metadata is consumed by lib/module_api.sh.

RLCH_MODULE_ID="3.1.3"
RLCH_MODULE_TITLE="Ensure bluetooth services are not in use"
RLCH_MODULE_DESCRIPTION="Ensures the Bluetooth service supplied by the bluez package is stopped, disabled, and masked. No service changes are made when bluez is absent."
RLCH_MODULE_RATIONALE="Disabling Bluetooth prevents unnecessary short-range wireless connections and removes an avoidable attack surface from the server baseline."
RLCH_MODULE_LEVEL="1"
RLCH_MODULE_ENABLED="true"
RLCH_MODULE_REQUIRES_REBOOT="false"
RLCH_MODULE_OPENSCAP_RULE="xccdf_org.ssgproject.content_rule_service_bluetooth_disabled"
