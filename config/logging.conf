# This file is sourced by lib/configuration.sh. The variables declared here
# are consumed by the framework after sourcing and therefore appear unused
# when ShellCheck analyzes this configuration file independently.
# shellcheck disable=SC2034

RLCH_LOG_LEVEL="INFO"
RLCH_LOG_TO_CONSOLE="true"
RLCH_LOG_TO_FILE="true"
RLCH_LOG_FILENAME="framework.log"
RLCH_LOG_DATE_FORMAT="%Y-%m-%d %H:%M:%S"