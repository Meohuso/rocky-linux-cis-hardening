#!/usr/bin/env bash
#
# Rocky Linux CIS Hardening Framework
#
# Module discovery configuration
#
# SPDX-License-Identifier: MIT
#

# Enable module discovery.
RLCH_MODULE_DISCOVERY_ENABLED="true"

# Root directory containing all framework modules.
RLCH_MODULE_ROOT="${RLCH_MODULE_DIR}"

# Module namespace containing CIS hardening controls.
RLCH_MODULE_NAMESPACE="cis"

# Default module filter.
RLCH_MODULE_DEFAULT_FILTER="*"

# Required metadata filename for each module.
RLCH_MODULE_METADATA_FILENAME="metadata.conf"

# Required implementation filename for each module.
RLCH_MODULE_IMPLEMENTATION_FILENAME="module.sh"