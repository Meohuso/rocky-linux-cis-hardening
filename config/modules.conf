#!/usr/bin/env bash
#
# Rocky Linux CIS Hardening Framework
#
# Module discovery configuration.
#
# SPDX-License-Identifier: MIT
#

# This file is sourced by lib/configuration.sh. The variables declared here
# are consumed by the framework after sourcing and therefore appear unused
# when ShellCheck analyzes this configuration file independently.
# shellcheck disable=SC2034

RLCH_MODULE_DISCOVERY_ENABLED="true"

RLCH_MODULE_ROOT="${RLCH_MODULE_DIR}"

RLCH_MODULE_NAMESPACE="cis"

RLCH_MODULE_DEFAULT_FILTER="*"

RLCH_MODULE_METADATA_FILENAME="metadata.conf"

RLCH_MODULE_IMPLEMENTATION_FILENAME="module.sh"